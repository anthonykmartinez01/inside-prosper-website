<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background - dark matching brand -->
  <rect width="64" height="64" rx="12" fill="#1a1a1a"/>

  <!-- Diamond/gem icon matching the brand logo - orange gradient -->
  <defs>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5a623"/>
      <stop offset="50%" style="stop-color:#e8852d"/>
      <stop offset="100%" style="stop-color:#d4691e"/>
    </linearGradient>
  </defs>

  <!-- Diamond shape - main gem -->
  <path d="M32 8 L48 28 L32 56 L16 28 Z" fill="url(#gemGrad)"/>

  <!-- Diamond facet lines for depth -->
  <path d="M32 8 L32 56" stroke="#1a1a1a" stroke-width="0.8" opacity="0.3"/>
  <path d="M16 28 L48 28" stroke="#1a1a1a" stroke-width="0.8" opacity="0.3"/>
  <path d="M32 8 L16 28 L32 56" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>

  <!-- Top highlight facet -->
  <path d="M32 8 L24 28 L32 28 Z" fill="rgba(255,255,255,0.15)"/>
  <path d="M32 28 L24 28 L32 56 Z" fill="rgba(255,255,255,0.08)"/>
</svg>