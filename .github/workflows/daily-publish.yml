name: Daily Blog Publish

on:
  schedule:
    # Runs every day at 9:00 AM Central Time (14:00 UTC)
    # Adjusts for CDT (UTC-5) — posts go live at 9 AM in Texas
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows you to manually trigger from GitHub if needed

jobs:
  trigger-netlify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify Build
        run: curl -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
